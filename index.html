<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixels & Coffee</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="doodles">
        <span class="d1">☕</span>
        <span class="d2">✨</span>
        <span class="d3">🌸</span>
        <span class="d4">💜</span>
        <span class="d5">☁️</span>
    </div>

    <!-- Loading Screen -->
    <div id="loading-screen">

        <div class="coffee-loader">
            ☕
        </div>

        <div class="steam">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <h2>Brewing Creativity...</h2>

    </div>

    <!-- Background -->
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>

    <!-- Landing Page -->
    <section class="landing">
        <div class="left">
            <h3>Hello, I'm</h3>
            <h1>Pixels & Coffee</h1>
            <p class="tagline">
                Turning Ideas Into Interfaces
            </p>

            <p class="small-text">
                Welcome to my little corner of creativity,
                where every pixel has a purpose
                and every coffee fuels a new idea.
            </p>

            <a href="home.html" class="enter-btn">
                Enter My World →
            </a>
        </div>

        <div class="right">
            <img src="images/Coffee.png" alt="Coffee" class="Coffee">
            <img src="images/About-Laptop.png" alt="About-Laptop" class="About-Laptop">
            <img src="images/Books.png" alt="Books" class="Books">
            <img src="images/About-Coffee.png" alt="About-Coffee" class="About-Coffee">
            <img src="images/Star.png" alt="Star" class="Star">
        </div>
    </section>

    <!-- Footer -->
    <footer>
        Made with ☕ & 💜 by
        <span>Kanishka Goel</span>
    </footer>

    <div class="cursor"></div>
    <script src="script.js"></script>
    
</body>
</html>
